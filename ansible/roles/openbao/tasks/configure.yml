---
- name: Create OpenBao group
  ansible.builtin.group:
    name: "{{ openbao_group }}"
    system: true
    state: present

- name: Create OpenBao user
  ansible.builtin.user:
    name: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ openbao_data_dir }}"
    create_home: false
    state: present

- name: Create OpenBao directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ openbao_config_dir }}"
      mode: "0750"
    - path: "{{ openbao_data_dir }}"
      mode: "0700"
    - path: "{{ openbao_data_dir }}/raft"
      mode: "0700"

- name: Deploy OpenBao configuration
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_dir }}/openbao.hcl"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: "0640"
  notify: Restart OpenBao

- name: Deploy OpenBao systemd unit
  ansible.builtin.template:
    src: openbao.service.j2
    dest: /etc/systemd/system/openbao.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart OpenBao

- name: Enable and start OpenBao
  ansible.builtin.systemd_service:
    name: openbao
    enabled: true
    state: started
    daemon_reload: true

services:
  traefik:
    image: traefik:v3.6
    environment:
      REGRU_USERNAME_FILE: /run/secrets/regru_username
      REGRU_PASSWORD_FILE: /run/secrets/regru_password
    secrets:
      - regru_username
      - regru_password
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/swarm/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_data:/data
    networks:
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 256M
volumes:
  traefik_data:
networks:
  traefik-public:
    external: true
secrets:
  regru_username:
    external: true
  regru_password:
    external: true

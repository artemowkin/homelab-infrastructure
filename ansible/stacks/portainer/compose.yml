services:
  portainer:
    image: portainer/portainer-ce:2.45.1

    command: --http-disabled

    ports:
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any

      resources:
        limits:
          memory: 512M

volumes:
  portainer_data:
